<section class="cart">
  <h1>🛒 Your Cart</h1>

  @if (cart.items().length === 0) {
    <p>Your cart is empty.</p>
    <a routerLink="/store">← Back to store</a>
  } @else {
    @for (item of cart.items(); track item.product.id) {
      <div class="row">
        <span class="name"><img [src]="item.product.image" [alt]="item.product.name" /> {{ item.product.name }}</span>
        <div class="qty">
          <button (click)="cart.setQuantity(item.product.id, item.quantity - 1)">−</button>
          <span>{{ item.quantity }}</span>
          <button (click)="cart.setQuantity(item.product.id, item.quantity + 1)">+</button>
        </div>
        <span>{{ item.product.price * item.quantity }} EGP</span>
        <button class="remove" (click)="cart.remove(item.product.id)">Remove</button>
      </div>
    }

    <div class="summary">
      <strong>Total: {{ cart.total() }} EGP</strong>
      <div class="actions">
        <a routerLink="/store">Continue shopping</a>
        <a routerLink="/store/checkout" class="primary">Checkout →</a>
      </div>
    </div>
  }
</section>
